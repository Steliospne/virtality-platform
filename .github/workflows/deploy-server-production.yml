name: Deploy Server Production

on:
  push:
    branches:
      - main
    paths:
      - 'services/server/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.pnpmfile.cjs'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/deploy-server-production.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/virtality-app/virtality-server

jobs:
  build-and-push:
    if: github.repository == 'Virtality-app/virtality-platform'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.repository == 'Virtality-app/virtality-platform'
    needs: build-and-push
    # Self-hosted on the VPS — avoids flaky SSH from GitHub-hosted runners.
    runs-on: [self-hosted, vps]
    steps:
      - name: Deploy production on VPS
        run: |
          set -euo pipefail
          docker pull ghcr.io/virtality-app/virtality-server:production
          cd ~/infra
          ./scripts/infra.sh server-prod-up

      # Each pull re-tags :production, leaving the previous image dangling on the
      # VPS. Prune the ones older than a day so they do not pile up.
      - name: Prune stale images
        if: always()
        run: docker image prune --force --filter "until=24h"
