name: Deploy Team Bot

on:
  push:
    branches:
      - main
    paths:
      - 'services/team-bot/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.pnpmfile.cjs'
      - '.dockerignore'
      - '.github/workflows/deploy-team-bot.yml'
  # First deploy, or redeploying after changing secrets in the infra repo.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/virtality-app/virtality-team-bot

jobs:
  build-and-push:
    if: github.repository == 'Virtality-app/virtality-platform'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/team-bot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=team-bot
          cache-to: type=gha,mode=max,scope=team-bot

  deploy:
    if: github.repository == 'Virtality-app/virtality-platform'
    needs: build-and-push
    runs-on: [self-hosted, vps]
    steps:
      - name: Deploy team bot on VPS
        run: |
          set -euo pipefail
          docker pull ghcr.io/virtality-app/virtality-team-bot:production
          cd ~/infra
          ./scripts/infra.sh team-bot-up

      - name: Prune stale images
        if: always()
        run: docker image prune --force --filter "until=24h"
