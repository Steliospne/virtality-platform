name: Deploy Server Production

on:
  push:
    branches:
      - main
    paths:
      - 'services/server/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/deploy-server-production.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/virtality-app/virtality-server

jobs:
  build-and-push:
    if: github.repository == 'Virtality-app/virtality-platform'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.repository == 'Virtality-app/virtality-platform'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Hosted runners intermittently fail to dial the VPS (dial tcp :22 i/o timeout).
      # Retry with OpenSSH instead of nesting appleboy under wretry (multiline keys break YAML).
      - name: Deploy production to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          for attempt in 1 2 3 4 5; do
            echo "SSH deploy attempt ${attempt}/5"
            if ssh -4 -i "$KEY_FILE" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=60 \
              "${SSH_USER}@${SSH_HOST}" \
              'set -euo pipefail
               docker pull ghcr.io/virtality-app/virtality-server:production
               cd ~/infra
               ./scripts/infra.sh server-prod-up'
            then
              exit 0
            fi
            echo "Attempt ${attempt} failed; waiting 20s..."
            sleep 20
          done
          echo "All SSH deploy attempts failed"
          exit 1
